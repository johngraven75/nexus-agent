name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 3.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'
  APP_NAME: 'Nexus Agent'

jobs:
  # ── Validate ──────────────────────────────────────────────────────────────
  validate:
    name: Validate Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check (basic)
        run: |
          node -e "
            const fs = require('fs');
            ['src/main.js','src/preload.js','src/app.js'].forEach(f => {
              try { require('./' + f); } catch(e) {
                if (!e.message.includes('Cannot find module')) {
                  console.error('Syntax error in', f, ':', e.message);
                  process.exit(1);
                }
              }
            });
            console.log('✅ Basic syntax check passed');
          "

      - name: Check package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('✅ package.json valid');"

  # ── Build Windows ─────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: List dist artifacts
        run: ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 30

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./dist

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat << NOTES > release_notes.md
          # Nexus Agent v${VERSION}

          ## 🚀 What's New
          See [CHANGELOG.md](CHANGELOG.md) for full details.

          ## 📥 Installation
          1. Download \`Nexus-Agent-v${VERSION}-Windows-x64.zip\`
          2. Extract the zip
          3. Double-click \`INSTALL.bat\` or run \`win-unpacked\Nexus Agent.exe\` directly

          ## 🆓 Free Tier
          Works out of the box with no API key via HuggingFace serverless.
          For best quality: get a free [OpenRouter key](https://openrouter.ai/keys).

          ## ✅ Verified
          - Windows 10/11 x64
          - Tested with: OpenRouter free, HuggingFace serverless, Ollama local
          NOTES
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Nexus Agent v${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            dist/*.zip
            dist/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Build Verification ────────────────────────────────────────────────────
  verify-release:
    name: Verify Release Assets
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Check release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --repo ${{ github.repository }} --json assets | \
          python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          assets=data.get('assets',[])
          print(f'Release has {len(assets)} assets:')
          for a in assets:
              size_mb = a.get('size',0)/1024/1024
              print(f'  ✅ {a[\"name\"]} ({size_mb:.1f}MB)')
          if not assets:
              print('❌ No assets found!')
              sys.exit(1)
          "
