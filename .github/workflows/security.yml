name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ── CodeQL Analysis ───────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # ── Dependency Audit ──────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for known CVEs in electron
        run: |
          ELECTRON_VER=$(node -e "console.log(require('./node_modules/electron/package.json').version)")
          echo "Electron version: $ELECTRON_VER"
          # Check against NIST NVD (simplified)
          echo "✅ Electron $ELECTRON_VER — check https://electronjs.org/releases for security advisories"

  # ── Secret Scanning ───────────────────────────────────────────────────────
  secret-scan:
    name: Secret / Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Check for hardcoded API patterns
        run: |
          echo "Scanning for hardcoded credentials..."
          PATTERNS=(
            "sk-ant-[a-zA-Z0-9]"
            "sk-or-[a-zA-Z0-9]"
            "hf_[a-zA-Z0-9]{30}"
            "gsk_[a-zA-Z0-9]"
            "AIza[a-zA-Z0-9_-]{35}"
            "AKIA[A-Z0-9]{16}"
          )
          FOUND=0
          for p in "${PATTERNS[@]}"; do
            if grep -r --include="*.js" --include="*.json" -E "$p" src/ 2>/dev/null | grep -v "placeholder\|example\|template\|test"; then
              echo "⚠️  Potential credential pattern found: $p"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 0 ]; then
            echo "✅ No hardcoded credentials detected in source files"
          fi

  # ── Electron Security Checklist ───────────────────────────────────────────
  electron-security:
    name: Electron Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Electron security settings
        run: |
          echo "=== Electron Security Audit ==="
          node -e "
          const fs = require('fs');
          const main = fs.readFileSync('src/main.js','utf8');
          const checks = [
            { name:'contextIsolation enabled', pass: main.includes('contextIsolation: true') },
            { name:'nodeIntegration disabled', pass: main.includes('nodeIntegration: false') },
            { name:'preload script used', pass: main.includes('preload:') },
            { name:'no remote module', pass: !main.includes('require(\"electron\").remote') },
            { name:'no eval usage in main', pass: !main.includes('eval(') },
          ];
          let allPass = true;
          checks.forEach(c => {
            const icon = c.pass ? '✅' : '❌';
            console.log(icon + ' ' + c.name);
            if (!c.pass) allPass = false;
          });
          if (!allPass) process.exit(1);
          console.log('\n✅ All Electron security checks passed');
          "

      - name: Check CSP headers (if any)
        run: |
          if grep -q "Content-Security-Policy" src/index.html; then
            echo "✅ CSP header found in index.html"
          else
            echo "ℹ️  No CSP header in index.html (Electron app — not required)"
          fi
